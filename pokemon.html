<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Liste des pokémons</title>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="filter.js"></script>
</head>

<body>
    <img src="assests/pokemon.png" alt="Loko pokémon" />
    <hr />
    <br />
    <button id="filter-all">All</button>
    <button id="filter-weight">+ 3 kg</button>
    <button id="filter-height">- 1 m</button>
    <br />
    <hr />
    <table>
        <thead>
            <tr>
                <th>Nom pokémon</th>
                <th>Poids</th>
                <th>Taille</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>beedrill</td>
                <td class="pokemon-weight">29.5</td>
                <td class="pokemon-height">1</td>
            </tr>
            <tr>
                <td>blastoise</td>
                <td class="pokemon-weight">85.5</td>
                <td class="pokemon-height">1.6</td>
            </tr>
            <tr>
                <td>bulbasaur</td>
                <td class="pokemon-weight">6.9</td>
                <td class="pokemon-height">0.7</td>
            </tr>
            <tr>
                <td>butterfree</td>
                <td class="pokemon-weight">32</td>
                <td class="pokemon-height">1.1</td>
            </tr>
            <tr>
                <td>caterpie</td>
                <td class="pokemon-weight">2.9</td>
                <td class="pokemon-height">0.3</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
